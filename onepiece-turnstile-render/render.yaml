services:
  - type: web
    name: onepiece-character-builder
    runtime: docker
    plan: free
    healthCheckPath: /?action=health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
